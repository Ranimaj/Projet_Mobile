org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvm.options=-Xmx1024M
org.gradle.daemon=false
# Desactive le cache de build Gradle et la compilation en parallele :
# evite un bug Windows connu ou plusieurs modules Kotlin natifs tentent
# d'enregistrer le meme cache incremental simultanement
# ("is already registered" / "Could not close incremental caches").
org.gradle.caching=false
org.gradle.parallel=false
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
