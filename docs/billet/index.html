<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Billet CampusConnect</title>
<style>
  :root { --bg: #f4f4f8; --muted-bg: #6b6880; --card: #ffffff; --ink: #1d1b2e; --soft: #5d5a70; --line: #e6e5f0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14131c; --muted-bg: #b3b0c8; } }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; min-height: 100vh; background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; color: var(--ink);
    display: flex; justify-content: center; align-items: flex-start;
  }
  main { width: 100%; max-width: 440px; }
  /* La carte reste blanche dans les deux thèmes, comme le billet de l'application. */
  .card { background: var(--card); border-radius: 22px; overflow: hidden; box-shadow: 0 6px 24px rgba(20,19,28,.18); }
  .band { padding: 15px 22px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .body { padding: 22px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; color: var(--ink); overflow-wrap: anywhere; }
  .holder { color: var(--soft); margin: 0 0 16px; overflow-wrap: anywhere; }
  .row { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; color: var(--ink); }
  .row svg { flex: none; width: 20px; height: 20px; margin-top: 2px; stroke: var(--soft); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .row span { overflow-wrap: anywhere; }
  .pill { display: inline-block; margin: 10px 0 4px; padding: 7px 18px; border-radius: 999px; border: 1.5px solid; font-weight: 700; font-size: 15px; }
  .ref { margin-top: 16px; padding: 12px 14px; border-radius: 12px; border: 1px dashed #b9b7cc; color: var(--ink);
         text-align: center; font-weight: 700; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .note { margin-top: 14px; font-size: 14px; color: var(--soft); }
  .empty { padding: 28px 22px; text-align: center; color: var(--soft); }
  footer { margin: 14px 4px 0; text-align: center; color: var(--muted-bg); font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="card" id="card"></div>
  <footer>CampusConnect · Événements du campus</footer>
</main>
<script>
(function () {
  var card = document.getElementById('card');
  var NS = 'http://www.w3.org/2000/svg';
  var ICONS = {
    calendar: ['M4 6h16v14H4z', 'M4 10h16', 'M8 3v4', 'M16 3v4'],
    clock: ['M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', 'M12 7v5l3 2'],
    pin: ['M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z', 'M12 7.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z'],
    tag: ['M3 12V4h8l10 10-8 8L3 12z', 'M7.5 8.5h.01']
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;       // textContent only: rien de l'adresse n'est interprété comme du HTML
    return n;
  }
  function icon(name) {
    var s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('aria-hidden', 'true');
    ICONS[name].forEach(function (d) { var p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); s.appendChild(p); });
    return s;
  }
  function row(name, text) {
    var r = el('div', 'row'); r.appendChild(icon(name)); r.appendChild(el('span', '', text)); return r;
  }
  function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
  function cut(s, n) { s = (s || '').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function fmt(iso, opts) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    opts.timeZone = 'Africa/Tunis';
    return new Intl.DateTimeFormat('fr-FR', opts).format(d);
  }
  function validColor(h) { return /^[0-9a-fA-F]{6}$/.test(h || '') ? '#' + h : '#4F46E5'; }
  function textOn(hex) {            // blanc sur couleur foncée, encre sur couleur claire
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 170 ? '#1d1b2e' : '#ffffff';
  }

  var hash = location.hash.replace(/^#/, '');
  var q = hash.indexOf('?');
  var idPart = safeDecode(q === -1 ? hash : hash.slice(0, q));
  var params = new URLSearchParams(q === -1 ? '' : hash.slice(q + 1));

  var m = /^CC1\|([A-Za-z0-9_-]{1,64})\|([A-Za-z0-9_-]{1,64})$/.exec(idPart);
  var color = validColor(params.get('k'));
  var band = el('div', 'band');
  band.style.background = color; band.style.color = textOn(color);

  if (!m) {
    band.textContent = 'Billet · CampusConnect';
    card.appendChild(band);
    card.appendChild(el('p', 'empty', 'Ce lien ne contient pas de billet lisible. Ouvrez-le en scannant le code QR d’un billet CampusConnect.'));
    return;
  }

  var category = cut(params.get('c'), 24);
  var title = cut(params.get('t'), 120) || 'Événement CampusConnect';
  var holder = cut(params.get('n'), 80);
  var place = cut(params.get('p'), 140);
  var price = cut(params.get('x'), 16);
  var start = params.get('d'), end = params.get('e');

  band.textContent = 'Billet' + (category ? ' · ' + category : '');
  card.appendChild(band);

  var body = el('div', 'body');
  body.appendChild(el('h1', '', title));
  if (holder) body.appendChild(el('p', 'holder', holder));

  var dateTxt = start ? fmt(start, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : null;
  var t1 = start ? fmt(start, { hour: '2-digit', minute: '2-digit' }) : null;
  var t2 = end ? fmt(end, { hour: '2-digit', minute: '2-digit' }) : null;
  if (dateTxt) body.appendChild(row('calendar', dateTxt.charAt(0).toUpperCase() + dateTxt.slice(1)));
  if (t1) body.appendChild(row('clock', t1 + (t2 ? ' → ' + t2 : '')));
  if (place) body.appendChild(row('pin', place));
  if (price) {
    var free = /^gratuit$/i.test(price);
    var pill = el('span', 'pill', price);
    pill.style.color = free ? '#0f7a4a' : color;
    pill.style.borderColor = free ? '#0f7a4a' : color;
    pill.style.background = free ? '#e8f7ef' : 'transparent';
    body.appendChild(pill);
  }

  // Référence : celle que l'application affiche sous son QR (paramètre r) ; à défaut, calculée depuis les identifiants.
  var given = (params.get('r') || '').trim().toUpperCase();
  var ref = /^[0-9A-Z-]{3,20}$/.test(given) ? given
    : m[1].replace(/[^A-Za-z0-9]/g, '').slice(0, 4).toUpperCase() + '-' + m[2].replace(/[^A-Za-z0-9]/g, '').slice(0, 4).toUpperCase();
  body.appendChild(el('div', 'ref', 'Billet n° ' + ref));
  body.appendChild(el('p', 'note', 'Présentez ce billet à l’organisateur : il le scanne dans l’application CampusConnect, qui vérifie l’inscription. Cette page ne valide rien.'));
  card.appendChild(body);
  document.title = 'Billet · ' + title;
})();
</script>
</body>
</html>
