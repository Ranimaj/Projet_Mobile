name: campusconnect
description: "CampusConnect — plateforme étudiante tout-en-un (Vente & Don, Annonces, Événements, Stage & Emploi), données stockées en SQLite sur le téléphone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State management ---
  provider: ^6.1.2

  # --- Offline / local persistence ---
  connectivity_plus: ^6.0.5

  # --- UI / UX ---
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

  # --- Fonctionnalités avancées ---
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  local_auth: ^2.3.0

  # --- Utilitaires ---
  uuid: ^4.5.1
  equatable: ^2.0.5
  go_router: ^14.3.0
  fl_chart: ^1.3.0
  shared_preferences: ^2.5.6
  add_2_calendar: ^3.1.1
  mailer: ^6.4.1 # emails du suivi de candidature (SMTP Gmail)
  open_filex: ^4.6.0 # ouvrir un CV
  http: ^1.6.0 # API Gemini, météo, itinéraires
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2
  mobile_scanner: ^7.4.2
  sqflite: ^2.4.5
  path: ^1.9.1
  crypto: ^3.0.6 # empreinte des mots de passe (PBKDF2)

  # --- IA (Vente & Don) ---
  google_mlkit_image_labeling: '>=0.14.0 <2.0.0' # reconnaissance d'objets sur le téléphone
  device_info_plus: ^12.4.0

  # --- Événements : « Scanner une affiche » ---
  google_mlkit_text_recognition: ^1.0.1 # lecture du texte sur le téléphone (alphabet latin, modèle embarqué)

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.5 # SQLite sur PC pour les tests

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/demo/
    - assets/models/
    - assets/ml/category_model.json
