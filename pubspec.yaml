name: campusconnect
description: "CampusConnect — plateforme étudiante tout-en-un (Vente & Don, Annonces, Événements, Stage & Emploi) avec support hors-ligne."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Firebase ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # --- State management ---
  provider: ^6.1.2

  # --- Offline / local persistence ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5

  # --- UI / UX ---
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

  # --- Fonctionnalités avancées ---
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  local_auth: ^2.3.0
  google_sign_in: ^6.2.1

  # --- Utilitaires ---
  uuid: ^4.5.1
  equatable: ^2.0.5
  go_router: ^14.3.0
  add_2_calendar: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
